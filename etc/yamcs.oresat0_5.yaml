services:
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.archive.XtceTmRecorder
  
  - class: org.yamcs.parameter.SystemParametersService
    args:
      provideJvmVariables: true
      provideFsVariables: true

  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime

  
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
      backFiller:
        enabled: false
        warmupTime: 60

  - class: org.yamcs.cfdp.CfdpService
    name: cfdp
    args:
     inactivityTimeout: 30000
     sequenceNrLength: 4
     maxPduSize: 976  # Max size that can fit in a 1024 max size USLP frame
     incomingBucket: groundstation
     allowRemoteProvidedBucket: false
     allowRemoteProvidedSubdirectory: false
     allowDownloadOverwrites: false
     # Disabled: Yamcs queues a DIRECTORY LISTING REQUEST transfer at startup
     # with remotePath=null, which poisons the upload dedup check in
     # CfdpService.startUpload (NPE on getRemotePath().equals(...)).
     automaticDirectoryListingReloads: false
     maxExistingFileRenames: 1000
     eofAckTimeout: 3000
     eofAckLimit: 5
     sleepBetweenPdus: 1000
     maxNumPendingUploads: 1
     entityIdLength: 1
     # Entity IDs per oresat_c3/services/edl.py: SOURCE_ID=0 (ground), DEST_ID=1 (c3)
     localEntities:
       - name: groundstation
         id: 0
         bucket: groundstation
     remoteEntities:
       - name: satellite
         id: 1
     senderFaultHandlers:
       AckLimitReached: suspend
     fileListingParserClassName: org.yamcs.filetransfer.CsvListingParser
     fileListingParserArgs:
       timestampMultiplier: 1

dataLinks:
  # AX.25 Beacon telemetry channel
  - name: tm_beacon
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tmr_beacon
    port: 10015 # GS-Modem beacon telemetry port
    invalidPackets: DIVERT
    invalidPacketsStream: invalid_tm_stream
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      packetSize: 269
      seqCountOffset: -1
      timestampOffset: -1


  - name: tm_edl
    class: org.yamcs.tctm.ccsds.UdpTmFrameLink
    errorDetection: CRC16
    port: 10016 # GS-Modem USLP telemetry port
    frameType: USLP # Process all TM with USLP header
    spacecraftId: 0x4F53 # "OS" in ASCII
    badFrameStream: invalid_tm_stream # Process unrecognized TM here
    clcwStream: "clcw" #publish the received CLCW (OCF field) to this stream
    minFrameLength: 14 # 7 + 4 + 1 + 2. Needed so that insert zone doesn't throw an error.
    maxFrameLength: 1024 # Oresat limits things to this size packet. We should consider increasing this if the radio link is good enough.
    encryption:
      - spi: 1
        class: org.uniclogs.yamcs.security.sdls.SecurityAssociationOresatSdlsFactory
        args:
          keyFile: etc/oresat_key
    virtualChannels:
      # EDL Virtual Channel
      - vcId: 0
        encryptionSpis: [1]
        service: VCA # tells yamcs to use a custom handler instead of the default space/encaps packets handler.
        stream: tmr_edl
        useCop1: true
        vcfCountLength: 2 # number of bytes used for the VC frame count field (0-7)
        vcaHandlerClassName: org.uniclogs.yamcs.tctm.VcEdlDownlinkHandler
        packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
        packetPreprocessorArgs: # while it appears that this does nothing, this is required by yamcs.
          timestampOffset: -1 # If the edl is changed to have sequence numbers outside the insert zone, these
          seqCountOffset: -1 # should be handled by the preprocessor with these configuration flags.
          errorDetection:
            type: "NONE"  # the crc is already checked as part of the USLP frame. Because the edl uses uslp
                          # frames as packets, edl processing does not need to check this.

      # CFDP Virtual Channel
      - vcId: 1
        encryptionSpis: [1]
        service: VCA
        stream: cfdp_in
        vcaHandlerClassName: org.uniclogs.yamcs.tctm.CfdpVc1DownlinkHandler
        vcaHandlerArgs:
          cfdpStream: cfdp_in
        packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
        packetPreprocessorArgs:
          timestampOffset: -1
          seqCountOffset: -1
          errorDetection:
            type: "NONE"
      - vcId: 2 # VCID used for receiving CLCW stream.
        service: IDLE

  - name: tc_edl
    class: org.yamcs.tctm.ccsds.UdpTcFrameLink
    errorDetection: CRC16
    priorityScheme: ABSOLUTE
    host: localhost # GS-Modem Address
    frameType: USLP # Process all TM with USLP header
    port: 10025 # GS-Modem USLP telecommand port
    spacecraftId: 0x4F53 # "OS" in ASCII
    maxFrameLength: 1024 # Changing this temporarily because the c3 isn't setup to get USLP frames larger than 1024
    encryption:
      - spi: 1
        class: org.uniclogs.yamcs.security.sdls.SecurityAssociationOresatSdlsFactory
        args:
          keyFile: etc/oresat_key
    virtualChannels:
    # EDL Virtual Channel
    - vcId: 0
      encryptionSpi: 1
      encryptionSpis: [1]
      service: PACKET
      priority: 0
      useCop1: true
      vcfCountLength: 2 # number of bytes used for the VC frame count field (0-7)
      clcwStream: "clcw" #publish the received CLCW (OCF field) to this stream
      initialClcwWait: 3600
      maxPacketLength: 976 # Changing this temporarily because the c3 isn't setup to get USLP frames larger than 1024
      stream: tcr_edl 
      # commandPostprocessorClassName: org.yamcs.tctm.IssCommandPostprocessor
      # commandPostprocessorArgs:
      #   errorDetection:
      #     type: "CRC-16-CCIIT"
      #   enforceEvenNumberOfBytes: true

    # CFDP Virtual Channel
    - vcId: 1
      encryptionSpi: 1
      encryptionSpis: [1]
      service: PACKET
      priority: 0
      maxPacketLength: 976 # Changing this temporarily because the c3 isn't setup to get USLP frames larger than 1024
      stream: cfdp_tc
      # commandPostprocessorClassName: org.uniclogs.yamcs.tctm.EdlCommandPostprocessor
      # commandPostprocessorArgs:
      #   errorDetection:
      #     type: "CRC-16-CCIIT"
      # #   enforceEvenNumberOfBytes: true

mdb:
  - type: xtce
    spec: mdb/oresat0_5_edl.xtce
  - type: xtce # the uplink handler needs a CFDP metacommand for things to work. This adds a single empty metacommand.
    spec: mdb/cfdp.xtce
  - type: xtce
    spec: mdb/oresat0_5_beacon.xtce
  - type: xtce
    spec: mdb/sentinel_1/leop_beacon.xtce
  - type: xtce
    spec: mdb/sentinel_1/post_leop.xtce

streamConfig:
  tm:
    - name: tmr_beacon
      rootContainer: /oresat0_5_beacon/Beacon
    
    - name: tmr_edl
      processor: realtime
      rootContainer: /oresat0_5_edl/edl_responses
    
    - name: tmd_debug

  tc:
    - name: tcr_edl
      rootContainer: /oresat0_5_edl/edl_responses
      processor: realtime

    - name: cfdp_tc
      processor: realtime

  cmdHist: 
    - cmdhist_realtime
    - cmdhist_dump

  event: 
    - events_realtime
    - events_dump

  param:
    - pp_realtime
    - sys_param
    - proc_param

  invalidTm: invalid_tm_stream
  parameterAlarm: [ alarms_realtime ]
  eventAlarm: [ event_alarms_realtime ]
  sqlFile: etc/extra_streams.sql